
name: Build ELITE CITY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o ELITE_CITY_LAUNCHER_BUILD_PROJECT-1.zip -d project
          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Add ELITE CITY icon
        run: |
          test -s ic_launcher.png
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          RES="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES/drawable"
          cp ic_launcher.png "$RES/drawable/ic_launcher.png"
          python3 -c "import xml.etree.ElementTree as E; p='$MANIFEST'; t=E.parse(p); a=t.getroot().find('application'); ns='{http://schemas.android.com/apk/res/android}'; a.set(ns+'icon','@drawable/ic_launcher'); a.set(ns+'roundIcon','@drawable/ic_launcher'); t.write(p,encoding='utf-8',xml_declaration=True)"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          find "$PROJECT_DIR/app/build/outputs/apk" -name '*.apk' -exec cp {} output/ELITE-CITY.apk \;
          test -s output/ELITE-CITY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELITE-CITY-APK
          path: output/ELITE-CITY.apk
